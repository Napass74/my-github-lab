name: Basic Markdown Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm markdown files exist
        run: |
          test -f README.md
          test -f local-notes.md
          